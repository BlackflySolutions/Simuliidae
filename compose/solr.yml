version: "3.8"

services:
  zoo1:
    image: zookeeper:3.9
    hostname: zoo1
    environment:
      ZOO_MY_ID: 1
      ZOO_SERVERS: server.1=zoo1:2888:3888;2181
      ZOO_4LW_COMMANDS_WHITELIST: mntr,conf,ruok
    volumes:
      - zoo1_data:/data
      - zoo1_datalog:/datalog
    networks:
      - solr_net
    deploy:
      labels:
        zoo.domain: "{VSITE_DOMAIN}"
      restart_policy:
        condition: on-failure

  solr1:
    image: solr:9
    hostname: solr1
    ports:
      - "8983:8983"
    environment:
      ZK_HOST: "zoo1:2181"
      SOLR_HOST: "solr1"
    volumes:
      - solr1_data:/var/solr
    networks:
      - solr_net
    deploy:
      labels:
        solr.domain: "{VSITE_DOMAIN}"
      restart_policy:
        condition: on-failure

volumes:
  zoo1_data:
  zoo1_datalog:
  solr1_data:
  solr2_data:

networks:
  solr_net:
    driver: overlay
    attachable: true

